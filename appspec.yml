version: 0.0
os: linux

files:
  - source: /
    destination: /tmp/welllabs-deploy

hooks:
  BeforeInstall:
    - location: devops/scripts/before_install.sh
      timeout: 120
      runas: root

  AfterInstall:
    - location: devops/scripts/after_install.sh
      timeout: 600
      runas: root

  ApplicationStart:
    - location: devops/scripts/application_start.sh
      # Backend health wait is up to 36×5s (~180s) plus nginx/frontend restart.
      # 120s caused HEALTH_CONSTRAINTS mid-wait on beta.
      timeout: 360
      runas: root

  ValidateService:
    - location: devops/scripts/validate_service.sh
      timeout: 240
      runas: root
