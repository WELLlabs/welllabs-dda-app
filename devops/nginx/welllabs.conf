# Water Security Toolbox — nginx reverse proxy
# Frontend: SvelteKit (adapter-node) at /wst  → 127.0.0.1:3000
# API:      FastAPI (uvicorn)                 → 127.0.0.1:8080

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# TLS terminates at Cloudflare — empty proto from origin hop must not become http
map $http_x_forwarded_proto $forwarded_proto {
    ''      https;
    default $http_x_forwarded_proto;
}

upstream wst_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream wst_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    # Cloudflare connects to origin on port 443 (SSL mode = Full / Full Strict)
    # and on port 80 for Flexible mode.  We listen on both so no legacy server
    # on either port can continue to intercept external traffic.
    # default_server on both ports ensures this block wins over any stale vhost.
    listen 80  default_server;
    listen 443 ssl default_server;

    # Self-signed cert generated by after_install.sh.
    # Cloudflare "Full" mode accepts self-signed origin certificates.
    ssl_certificate     /etc/ssl/welllabs/cert.pem;
    ssl_certificate_key /etc/ssl/welllabs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server_name ai.welllabs.org _;

    client_max_body_size 100m;

    # FastAPI health (used by CodeDeploy ValidateService)
    location = /health {
        proxy_pass http://wst_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # FastAPI — /wst/backend (Cloudflare Worker crashes POST to /wst/api/*)
    # Regex + explicit $is_args$args keeps OAuth codes that contain "/" in the query string.
    location ~ ^/wst/backend/(.*)$ {
        proxy_pass http://wst_api/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Legacy paths → /wst/backend/*
    location /wst/api/ {
        rewrite ^/wst/api/(.*)$ /wst/backend/$1 permanent;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /wst/backend/$1 permanent;
    }

    # SvelteKit app (kit.paths.base = /wst)
    location /wst/ {
        proxy_pass http://wst_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /wst {
        return 301 /wst/;
    }

    # Convenience redirects when requests hit this nginx (auth paths without /wst)
    location = /login { return 301 /wst/login; }
    location = /register { return 301 /wst/register; }
    location = /forgot-password { return 301 /wst/forgot-password; }
    location = /verify { return 301 /wst/verify$is_args$args; }
    location = /reset-password { return 301 /wst/reset-password$is_args$args; }
    location = /complete-profile { return 301 /wst/complete-profile; }
    location = /home { return 301 /wst/home; }

    # Default → app
    location / {
        return 302 /wst/;
    }
}