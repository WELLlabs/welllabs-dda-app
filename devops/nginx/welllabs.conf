# Water Security Toolbox — nginx reverse proxy
# Frontend: SvelteKit (adapter-node) at /wst  → 127.0.0.1:3000
# API:      FastAPI (uvicorn)                 → 127.0.0.1:8080

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream wst_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream wst_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    # FastAPI health (used by CodeDeploy ValidateService)
    location = /health {
        proxy_pass http://wst_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # FastAPI — browser and SSR hit /api/* here (not via Node in production)
    location /api/ {
        proxy_pass http://wst_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # SSE (package / sync progress)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SvelteKit app (kit.paths.base = /wst)
    location /wst/ {
        proxy_pass http://wst_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /wst {
        return 301 /wst/;
    }

    # Convenience redirects when requests hit this nginx (auth paths without /wst)
    location = /login { return 301 /wst/login; }
    location = /register { return 301 /wst/register; }
    location = /forgot-password { return 301 /wst/forgot-password; }
    location = /verify { return 301 /wst/verify$is_args$args; }
    location = /reset-password { return 301 /wst/reset-password$is_args$args; }
    location = /complete-profile { return 301 /wst/complete-profile; }
    location = /home { return 301 /wst/home; }

    # Default → app
    location / {
        return 302 /wst/;
    }
}